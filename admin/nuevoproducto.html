<!DOCTYPE html>
<html lang="es">

<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ProperChile</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
                integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
                crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap"
                rel="stylesheet">
        <link rel="stylesheet" href="../style.css">
</head>

<body>
        <!--INICIO DE SESIÓN-->
        <div class="row">
                <div class="col-sm-2 p-0">
                        <div class="container-nav">
                                <div class="container-foto">
                                        <img id="logo-proper-nav" src="../assets/img/logos/logocolor.png">
                                </div>

                                <ul class="navbar-menu">
                                        <li>
                                                <a href="../admin/main.html">
                                                        <img class="navbar-admin-icon"
                                                                src="../assets/img/icons/home.png">
                                                        <span>Home</span>
                                                </a>
                                        </li>

                                        <li>
                                                <a href="../admin/productos.html">
                                                        <img class="navbar-admin-icon"
                                                                src="../assets/img/icons/addproduct.png">
                                                        <span>Productos</span>
                                                </a>
                                        </li>

                                        <li>
                                                <a href="../admin/clientes.html">
                                                        <img class="navbar-admin-icon"
                                                                src="../assets/img/icons/addclient.png">
                                                        <span>Usuarios</span>
                                                </a>
                                        </li>
                                </ul>

                                <div class="navbar-admin-logout">
                                        <a href="../usuario/main.html">
                                                <img class="navbar-admin-icon" src="../assets/img/icons/logout.png">
                                                <span>Cerrar sesión</span>
                                        </a>
                                </div>
                        </div>
                </div>

                <div class="col-sm-10 p-0">
                        <div class="container-form">
                                <form>
                                        <div class="registro-titulo">
                                                <h4>AGREGAR PRODUCTO</h4>
                                        </div>

                                        <div class="mb-3">
                                                <label for="id">ID</label>
                                                <input type="text" class="form-control" id="id"
                                                        placeholder="Ingrese id del producto" required>
                                        </div>

                                        <div class=" mb-3">
                                                <label for="nombre-producto">NOMBRE</label>
                                                <input type="text" class="form-control" id="nombre-producto"
                                                        placeholder="Ingrese nombre del producto" required>
                                        </div>

                                        <div class=" mb-3">
                                                <label for="descripcion-producto">DESCRIPCIÓN</label>
                                                <input type="text" class="form-control" id="descripcion-producto"
                                                        placeholder="Ingrese la descripcion del producto">
                                        </div>

                                        <div class=" mb-3">
                                                <label for="precio">PRECIO</label>
                                                <input type="number" class="form-control" id="precio"
                                                        placeholder="Ingrese precio del producto" step="0.01" required>
                                        </div>

                                        <div class="mb-3">
                                                <label for="stock">STOCK</label>
                                                <input type="number" class="form-control" id="stock"
                                                        placeholder="Ingrese stock disponible" step="1" required>
                                        </div>

                                        <div class="mb-3">
                                                <label for="stock-critico">STOCK CRÍTICO</label>
                                                <input type="number" class="form-control" id="stock-critico"
                                                        placeholder="Ingrese stock crítico" step="1">
                                        </div>

                                        <div class="mb-3">
                                                <label for="imagen">IMAGEN DEL PRODUCTO</label>
                                                <input type="file" class="form-control" id="imagen" accept="image/*">
                                        </div>

                                        <div class="mb-3">
                                                <label for="linea" class="form-label">-- LÍNEA --</label>
                                                <select class="form-control" id="linea" required>
                                                        <option value="" selected disabled>Seleccione una línea</option>
                                                        <option value="hogar">Línea Hogar</option>
                                                        <option value="automotriz">Línea Automotriz</option>
                                                        <option value="limpiezaysanitizacion">Línea Limpieza y
                                                                Sanitización</option>
                                                        <option value="casinoyrestaurant">Línea Casino y Restaurant
                                                        </option>
                                                        <option value="tratamientopisosduros">Línea Tratamiento Pisos
                                                                Duros</option>
                                                </select>
                                        </div>
                        </div>

                        <div class="text-center">
                                <button type="submit" class="btn btn-primary btn-lg px-5 mt-4">Ingresar
                                        Producto</button>
                        </div>

                </div>

                <script>
                        const formulario = document.querySelector("form");

                        formulario.addEventListener("submit", function (event) {

                                const id = document.getElementById("id").value;
                                const nombre = document.getElementById("nombre-producto").value;
                                const descripcion = document.getElementById("descripcion-producto").value;
                                const precio = document.getElementById("precio").value;
                                const stock = document.getElementById("stock").value;
                                const stockcritico = document.getElementById("stock-critico").value;
                                const linea = document.getElementById("linea").value;

                                if (id.length < 3) {
                                        alert("El id debe tener mínimo 3 caracteres");
                                        event.preventDefault();
                                        return;
                                }

                                if (nombre.length > 100) {
                                        alert("El id debe tener máximo 100 caracteres");
                                        event.preventDefault();
                                        return;
                                }

                                if (descripcion.length > 500) {
                                        alert("El id debe tener máximo 500 caracteres");
                                        event.preventDefault();
                                        return;
                                }

                                if (precio === "0") {
                                        alert("El producto será FREE");
                                }

                                if (precio < 0) {
                                        alert("El precio no puede ser negativo");
                                        event.preventDefault();
                                        return;
                                }

                                if (stock < 0) {
                                        alert("El stock no puede ser negativo");
                                        event.preventDefault();
                                        return;
                                }

                                if (stockcritico < 0) {
                                        alert("El stock crítico no puede ser negativo");
                                        event.preventDefault();
                                        return;
                                }

                                if (stock <= stockcritico) {
                                        alert("Advertencia, el stock es menor al stock crítico del producto");
                                }
                        });
                </script>
</body>

</html>
